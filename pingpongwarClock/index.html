<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong War Clock - Vietnam Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
        }
        
        body {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0.85;
        }
        
        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .time-overlay {
            position: absolute;
            font-size: clamp(4rem, 18vmin, 12rem);
            font-weight: 200;
            color: #ffffff;
            background: transparent;
            padding: 0;
            border-radius: 0;
            backdrop-filter: none;
            text-shadow: 
                0 0 40px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(0, 0, 0, 0.6),
                0 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10;
            font-feature-settings: 'tnum';
            -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.3);
        }
        
        .am-pm {
            font-size: clamp(1rem, 4vmin, 2.5rem);
            margin-left: 0.5rem;
            opacity: 0.7;
            font-weight: 200;
        }
        
        #score {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: clamp(0.75rem, 2vmin, 1rem);
            color: rgba(255, 255, 255, 0.4);
            text-shadow: none;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            z-index: 20;
        }
        
        @media (max-width: 768px) {
            #score {
                bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="canvas-container">
            <canvas id="pongCanvas"></canvas>
            <div class="time-overlay" id="timeDisplay">00:00:00</div>
        </div>
        <div id="score">LOADING...</div>
    </div>

    <script>
        const colorPalette = {
            ArcticPowder: "#F1F6F4",
            MysticMint: "#D9E8E3",
            NocturnalExpedition: "#114C5A",
            OceanicNoir: "#172B36",
        };

        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const timeDisplay = document.getElementById("timeDisplay");

        const DAY_COLOR = colorPalette.MysticMint;
        const DAY_BALL_COLOR = colorPalette.NocturnalExpedition;
        const NIGHT_COLOR = colorPalette.NocturnalExpedition;
        const NIGHT_BALL_COLOR = colorPalette.MysticMint;
        const SQUARE_SIZE = 25;
        const MIN_SPEED = 5;
        const MAX_SPEED = 10;

        let numSquaresX;
        let numSquaresY;
        let TOTAL_SQUARES;
        let dayScore = 0;
        let nightScore = 0;
        let squares = [];
        let balls = [];
        let iteration = 0;

        // Track ball positions to detect if stuck
        let ballHistory = [[], []];

        // Set canvas to full viewport size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            numSquaresX = Math.floor(canvas.width / SQUARE_SIZE);
            numSquaresY = Math.floor(canvas.height / SQUARE_SIZE);
            TOTAL_SQUARES = numSquaresX * numSquaresY;
            
            // Reinitialize squares grid
            squares = [];
            for (let i = 0; i < numSquaresX; i++) {
                squares[i] = [];
                for (let j = 0; j < numSquaresY; j++) {
                    squares[i][j] = i < numSquaresX / 2 ? DAY_COLOR : NIGHT_COLOR;
                }
            }
            
            // Initialize or reposition balls
            if (balls.length === 0) {
                balls = [
                    {
                        x: canvas.width / 4,
                        y: canvas.height / 2,
                        dx: 8,
                        dy: -8,
                        reverseColor: DAY_COLOR,
                        ballColor: DAY_BALL_COLOR,
                    },
                    {
                        x: (canvas.width / 4) * 3,
                        y: canvas.height / 2,
                        dx: -8,
                        dy: 8,
                        reverseColor: NIGHT_COLOR,
                        ballColor: NIGHT_BALL_COLOR,
                    },
                ];
            } else {
                balls[0].x = canvas.width / 4;
                balls[0].y = canvas.height / 2;
                balls[1].x = (canvas.width / 4) * 3;
                balls[1].y = canvas.height / 2;
            }
            
            // Reset ball history
            ballHistory = [[], []];
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawBall(ball) {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, SQUARE_SIZE / 2, 0, Math.PI * 2, false);
            ctx.fillStyle = ball.ballColor;
            ctx.fill();
            ctx.closePath();
        }

        function drawSquares() {
            dayScore = 0;
            nightScore = 0;

            for (let i = 0; i < numSquaresX; i++) {
                for (let j = 0; j < numSquaresY; j++) {
                    ctx.fillStyle = squares[i][j];
                    ctx.fillRect(i * SQUARE_SIZE, j * SQUARE_SIZE, SQUARE_SIZE, SQUARE_SIZE);

                    // Update scores
                    if (squares[i][j] === DAY_COLOR) dayScore++;
                    if (squares[i][j] === NIGHT_COLOR) nightScore++;
                }
            }
        }

        function checkSquareCollision(ball) {
            let hasCollided = false;
            
            // Check multiple points around the ball's circumference
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                const checkX = ball.x + Math.cos(angle) * (SQUARE_SIZE / 2);
                const checkY = ball.y + Math.sin(angle) * (SQUARE_SIZE / 2);

                const i = Math.floor(checkX / SQUARE_SIZE);
                const j = Math.floor(checkY / SQUARE_SIZE);

                if (i >= 0 && i < numSquaresX && j >= 0 && j < numSquaresY) {
                    if (squares[i][j] !== ball.reverseColor) {
                        // Square hit! Update square color
                        squares[i][j] = ball.reverseColor;

                        if (!hasCollided) {
                            // Determine bounce direction based on the angle
                            if (Math.abs(Math.cos(angle)) > Math.abs(Math.sin(angle))) {
                                ball.dx = -ball.dx;
                            } else {
                                ball.dy = -ball.dy;
                            }
                            hasCollided = true;
                        }
                    }
                }
            }
        }

        function checkBoundaryCollision(ball) {
            // Check boundaries with some padding to prevent getting stuck
            const padding = SQUARE_SIZE;
            
            if (ball.x + ball.dx > canvas.width - padding) {
                ball.x = canvas.width - padding;
                ball.dx = -Math.abs(ball.dx);
            }
            if (ball.x + ball.dx < padding) {
                ball.x = padding;
                ball.dx = Math.abs(ball.dx);
            }
            if (ball.y + ball.dy > canvas.height - padding) {
                ball.y = canvas.height - padding;
                ball.dy = -Math.abs(ball.dy);
            }
            if (ball.y + ball.dy < padding) {
                ball.y = padding;
                ball.dy = Math.abs(ball.dy);
            }
        }

        function detectAndFixStuckBall(ball, ballIndex) {
            // Keep history of last 30 positions
            ballHistory[ballIndex].push({x: ball.x, y: ball.y});
            if (ballHistory[ballIndex].length > 30) {
                ballHistory[ballIndex].shift();
            }
            
            // Check if ball is stuck (moving very little over last 30 frames)
            if (ballHistory[ballIndex].length >= 30) {
                const first = ballHistory[ballIndex][0];
                const last = ballHistory[ballIndex][ballHistory[ballIndex].length - 1];
                const distance = Math.sqrt(Math.pow(last.x - first.x, 2) + Math.pow(last.y - first.y, 2));
                
                // If ball moved less than 30 pixels in 30 frames, it's stuck
                if (distance < 30) {
                    // Unstick the ball by giving it a new velocity direction
                    const angle = Math.random() * Math.PI * 2;
                    const speed = MIN_SPEED + Math.random() * 2;
                    ball.dx = Math.cos(angle) * speed;
                    ball.dy = Math.sin(angle) * speed;
                    
                    // Give it a small nudge in the direction it should go
                    ball.x += ball.dx * 3;
                    ball.y += ball.dy * 3;
                    
                    // Clear history
                    ballHistory[ballIndex] = [];
                }
            }
        }

        function addRandomness(ball) {
            ball.dx += Math.random() * 0.02 - 0.01;
            ball.dy += Math.random() * 0.02 - 0.01;

            // Limit the speed of the ball
            ball.dx = Math.min(Math.max(ball.dx, -MAX_SPEED), MAX_SPEED);
            ball.dy = Math.min(Math.max(ball.dy, -MAX_SPEED), MAX_SPEED);

            // CRITICAL: Always maintain minimum speed - check every frame
            const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            if (currentSpeed < MIN_SPEED) {
                const angle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(angle) * MIN_SPEED;
                ball.dy = Math.sin(angle) * MIN_SPEED;
            }
            
            // CRITICAL: Ensure minimum speed in each direction to prevent horizontal/vertical only movement
            const minDirectionalSpeed = MIN_SPEED * 0.3;
            if (Math.abs(ball.dx) < minDirectionalSpeed) {
                ball.dx = ball.dx >= 0 ? minDirectionalSpeed : -minDirectionalSpeed;
            }
            if (Math.abs(ball.dy) < minDirectionalSpeed) {
                ball.dy = ball.dy >= 0 ? minDirectionalSpeed : -minDirectionalSpeed;
            }
        }

        // FAILSAFE: Check every frame that balls are moving
        function ensureBallsMoving(ball) {
            const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            
            // If speed is critically low, force movement
            if (speed < MIN_SPEED * 0.5) {
                const angle = Math.random() * Math.PI * 2;
                ball.dx = Math.cos(angle) * MIN_SPEED;
                ball.dy = Math.sin(angle) * MIN_SPEED;
            }
            
            // Prevent getting stuck in corners by checking position
            const cornerPadding = SQUARE_SIZE * 3;
            const isNearCorner = 
                (ball.x < cornerPadding || ball.x > canvas.width - cornerPadding) &&
                (ball.y < cornerPadding || ball.y > canvas.height - cornerPadding);
            
            if (isNearCorner) {
                // Push away from corners
                const toCenterX = canvas.width / 2 - ball.x;
                const toCenterY = canvas.height / 2 - ball.y;
                const angle = Math.atan2(toCenterY, toCenterX);
                
                ball.dx = Math.cos(angle) * MIN_SPEED + ball.dx * 0.5;
                ball.dy = Math.sin(angle) * MIN_SPEED + ball.dy * 0.5;
            }
        }

        // Get Vietnam time
        function getVietnamTime() {
            const now = new Date();
            const vietnamTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
            
            const hours24 = vietnamTime.getHours();
            const minutes = vietnamTime.getMinutes();
            const seconds = vietnamTime.getSeconds();
            
            // Convert to 12-hour format
            const ampm = hours24 >= 12 ? 'PM' : 'AM';
            const hours12 = hours24 % 12 || 12; // Convert 0 to 12 for midnight
            
            // Calculate seconds since midnight
            const secondsSinceMidnight = hours24 * 3600 + minutes * 60 + seconds;
            
            // Create a natural day/night cycle using sine wave
            const hourOfDay = hours24 + minutes / 60 + seconds / 3600;
            const angle = ((hourOfDay - 6) / 24) * Math.PI * 2;
            const dayIntensity = (Math.sin(angle) + 1) / 2;
            
            // Map to percentage (10% to 90%)
            const minDayPercentage = 0.10;
            const maxDayPercentage = 0.90;
            const dayPercentage = minDayPercentage + (dayIntensity * (maxDayPercentage - minDayPercentage));
            
            const targetDayScore = Math.floor(dayPercentage * TOTAL_SQUARES);
            
            return {
                hours: String(hours12).padStart(2, '0'),
                minutes: String(minutes).padStart(2, '0'),
                seconds: String(seconds).padStart(2, '0'),
                hours24: hours24,
                ampm: ampm,
                targetDayScore: targetDayScore,
                secondsSinceMidnight: secondsSinceMidnight,
                dayPercentage: dayPercentage
            };
        }

        // Adjust game state to match target score
        function synchronizeGameWithTime() {
            const time = getVietnamTime();
            const targetDayScore = time.targetDayScore;
            const currentDayScore = dayScore;
            const difference = targetDayScore - currentDayScore;
            
            // Aggressively adjust squares to match time
            if (Math.abs(difference) > 0) {
                const adjustCount = Math.min(Math.abs(difference), 10);
                
                for (let adjusted = 0; adjusted < adjustCount; adjusted++) {
                    const randomI = Math.floor(Math.random() * numSquaresX);
                    const randomJ = Math.floor(Math.random() * numSquaresY);
                    
                    if (difference > 0) {
                        if (squares[randomI][randomJ] === NIGHT_COLOR) {
                            squares[randomI][randomJ] = DAY_COLOR;
                        }
                    } else {
                        if (squares[randomI][randomJ] === DAY_COLOR) {
                            squares[randomI][randomJ] = NIGHT_COLOR;
                        }
                    }
                }
            }
        }

        function updateTimeDisplay() {
            const time = getVietnamTime();
            timeDisplay.innerHTML = `${time.hours}:${time.minutes}:${time.seconds}<span class="am-pm">${time.ampm}</span>`;
            
            // Show day/night distribution
            const actualDayPercentage = ((dayScore / TOTAL_SQUARES) * 100).toFixed(0);
            const nightPercentage = 100 - actualDayPercentage;
            
            // Determine if it's day or night time
            const isDayTime = time.hours24 >= 6 && time.hours24 < 18;
            const timeOfDay = isDayTime ? '☀' : '☾';
            
            scoreElement.textContent = `${timeOfDay} Day ${actualDayPercentage}% · Night ${nightPercentage}%`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Synchronize game state with actual time
            synchronizeGameWithTime();
            
            drawSquares();

            balls.forEach((ball, index) => {
                // FAILSAFE: Ensure ball is always moving before any other operation
                ensureBallsMoving(ball);
                
                drawBall(ball);
                checkSquareCollision(ball);
                checkBoundaryCollision(ball);
                
                // Move ball
                ball.x += ball.dx;
                ball.y += ball.dy;

                // Add natural variation
                addRandomness(ball);
                
                // Detect and fix stuck balls (additional safety layer)
                detectAndFixStuckBall(ball, index);
            });

            // Update time display
            updateTimeDisplay();

            iteration++;
        }

        const FRAME_RATE = 100;
        setInterval(draw, 1000 / FRAME_RATE);
    </script>
</body>
</html>
