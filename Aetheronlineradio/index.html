                                        {isSearching ? <IconLoader /> : <IconSearch />}
                                    </button>
                                </form>
                                <div className="flex gap-2 mt-3">
                                    <button 
                                        onClick={handleFeelingLucky}
                                        className="flex-1 bg-white/5 hover:bg-white/10 text-xs text-white/60 hover:text-white py-2 rounded-full flex items-center justify-center gap-1.5 transition-all border border-white/5"
                                        disabled={isSearching}
                                    >
                                        <IconDice /> Surprise Me
                                    </button>
                                    
                                    <button 
                                        onClick={() => setIsTravelMode(!isTravelMode)}
                                        className={`flex-1 text-xs py-2 rounded-full flex items-center justify-center gap-1.5 transition-all border ${isTravelMode ? 'bg-white/20 text-white border-white/20' : 'bg-white/5 text-white/60 hover:text-white hover:bg-white/10 border-white/5'}`}
                                        disabled={isSearching}
                                    >
                                        <IconGlobe /> {isTravelMode ? "Exit Globe" : "Explore"}
                                    </button>
                                </div>
                            </div>

                            {/* Station List */}
                            <div className="bg-black/50 backdrop-blur-2xl rounded-3xl overflow-hidden flex flex-col max-h-[35vh] border border-white/5">
                                <div className="p-4 border-b border-white/5 flex justify-between items-center">
                                    <span className="text-white/50 text-xs font-medium uppercase tracking-wider">Stations</span>
                                    <div className="flex gap-0.5 bg-white/10 p-0.5 rounded-full">
                                        <button 
                                            onClick={() => setShowFavoritesOnly(false)}
                                            className={`text-[10px] px-3 py-1 rounded-full transition-all font-medium ${!showFavoritesOnly ? 'bg-white text-black' : 'text-white/50 hover:text-white'}`}
                                        >
                                            All
                                        </button>
                                        <button 
                                            onClick={() => setShowFavoritesOnly(true)}
                                            className={`text-[10px] px-3 py-1 rounded-full transition-all ${showFavoritesOnly ? 'bg-white text-black' : 'text-white/50 hover:text-white'}`}
                                        >
                                            ♥
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="overflow-y-auto p-2 space-y-0.5">
                                    {filteredStations.length === 0 ? (
                                        <div className="text-center text-white/40 py-10 text-sm">
                                            No stations found
                                        </div>
                                    ) : (
                                        filteredStations.map(station => (
                                            <div 
                                                key={station.id}
                                                onClick={() => {
                                                    setCurrentStation(station);
                                                    setIsPlaying(true);
                                                    setSmartQuery(""); 
                                                    setError(false);
                                                }}
                                                className={`group flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all ${currentStation.id === station.id ? 'bg-white/15' : 'hover:bg-white/5'}`}
                                            >
                                                <div className="flex items-center gap-3 overflow-hidden">
                                                    <div 
                                                        className="w-1 h-8 rounded-full flex-shrink-0 opacity-80" 
                                                        style={{ backgroundColor: station.color }}
                                                    ></div>
                                                    <div className="overflow-hidden">
                                                        <h4 className={`text-sm font-medium truncate ${currentStation.id === station.id ? 'text-white' : 'text-white/80 group-hover:text-white'}`}>
                                                            {station.name}
                                                        </h4>
                                                        <p className="text-[11px] text-white/40 truncate">{station.genre}</p>
                                                    </div>
                                                </div>
                                                {currentStation.id === station.id && isPlaying && !error && (
                                                    <div className="flex gap-0.5 items-end h-3 mr-1">
                                                        <div className="w-0.5 bg-white/70 animate-[pulse_0.6s_ease-in-out_infinite] h-full rounded-full"></div>
                                                        <div className="w-0.5 bg-white/70 animate-[pulse_0.8s_ease-in-out_infinite] h-2/3 rounded-full"></div>
                                                        <div className="w-0.5 bg-white/70 animate-[pulse_0.5s_ease-in-out_infinite] h-full rounded-full"></div>
                                                    </div>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Mobile Bottom Panel */}
                        <div className={`md:hidden pointer-events-auto fixed bottom-0 left-0 right-0 bg-black/70 backdrop-blur-2xl border-t border-white/10 rounded-t-3xl transition-all duration-300 ease-out ui-content ${isUIHidden ? 'ui-hidden' : ''} ${isMobilePanelExpanded ? 'mobile-expanded' : 'mobile-collapsed'}`}>
                            
                            {/* Drag Handle */}
                            <div 
                                className="mobile-drag-handle cursor-pointer"
                                onClick={() => setIsMobilePanelExpanded(!isMobilePanelExpanded)}
                            ></div>
                            
                            {/* Now Playing - Always Visible */}
                            <div className="px-4 pb-3">
                                <div className="flex items-center gap-3">
                                    <button 
                                        onClick={() => {
                                            if(error) setError(false); 
                                            setIsPlaying(!isPlaying);
                                        }}
                                        className={`w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 transition-all ${error ? 'bg-red-500/90 text-white' : 'bg-white text-black active:scale-95'}`}
                                    >
                                        {isPlaying && !error ? <IconPause /> : <IconPlay />}
                                    </button>
                                    
                                    <div className="flex-1 min-w-0">
                                        <h2 className="font-medium text-sm text-white truncate">{currentStation.name}</h2>
                                        <p className="text-[11px] text-white/50 truncate">{currentStation.freq ? currentStation.freq + " FM" : "Streaming"} · {currentStation.genre}</p>
                                    </div>
                                    
                                    <div className="flex items-center gap-2 flex-shrink-0">
                                        <button onClick={() => setIsMuted(!isMuted)} className="text-white/50 active:text-white p-1">
                                            {isMuted || volume === 0 ? <IconMute /> : <IconVolume />}
                                        </button>
                                        <button 
                                            onClick={() => toggleFavorite(currentStation.id)}
                                            className="p-1"
                                        >
                                            <IconHeart filled={favorites.includes(currentStation.id)} />
                                        </button>
                                    </div>
                                </div>
                                
                                {/* Volume Slider */}
                                <div className="mt-3 flex items-center gap-3">
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="1" 
                                        step="0.01" 
                                        value={volume}
                                        onChange={(e) => {
                                            setVolume(parseFloat(e.target.value));
                                            if (isMuted) setIsMuted(false);
                                        }}
                                        className="w-full h-1 bg-white/20 rounded-full appearance-none cursor-pointer accent-white"
                                    />
                                </div>
                            </div>
                            
                            {/* Expanded Content */}
                            {isMobilePanelExpanded && (
                                <div className="px-4 pb-4 space-y-3 border-t border-white/10 pt-3">
                                    {/* Search */}
                                    <form onSubmit={handleSmartTune} className="flex w-full gap-2">
                                        <input 
                                            type="text" 
                                            placeholder='Search stations...'
                                            value={smartQuery}
                                            onChange={(e) => setSmartQuery(e.target.value)}
                                            className="flex-1 bg-white/10 border-0 rounded-full px-4 py-2.5 text-white text-sm placeholder-white/30 focus:outline-none focus:bg-white/15 transition-all"
                                            disabled={isSearching}
                                        />
                                        <button type="submit" disabled={isSearching} className="bg-white/15 active:bg-white/25 text-white p-2.5 rounded-full transition-all disabled:opacity-50">
                                            {isSearching ? <IconLoader /> : <IconSearch />}
                                        </button>
                                    </form>
                                    
                                    {/* Quick Actions */}
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handleFeelingLucky}
                                            className="flex-1 bg-white/5 active:bg-white/15 text-xs text-white/60 py-2.5 rounded-full flex items-center justify-center gap-1.5 transition-all border border-white/5"
                                            disabled={isSearching}
                                        >
                                            <IconDice /> Surprise
                                        </button>
                                        <button 
                                            onClick={() => setIsTravelMode(!isTravelMode)}
                                            className={`flex-1 text-xs py-2.5 rounded-full flex items-center justify-center gap-1.5 transition-all border ${isTravelMode ? 'bg-white/20 text-white border-white/20' : 'bg-white/5 text-white/60 border-white/5'}`}
                                            disabled={isSearching}
                                        >
                                            <IconGlobe /> Globe
                                        </button>
                                        <button 
                                            onClick={() => setIsSleepModalOpen(true)}
                                            className={`flex-1 text-xs py-2.5 rounded-full flex items-center justify-center gap-1.5 transition-all border ${sleepEndTime ? 'bg-white/20 text-white border-white/20' : 'bg-white/5 text-white/60 border-white/5'}`}
                                        >
                                            <IconClock /> {sleepEndTime ? timeLeft : 'Sleep'}
                                        </button>
                                    </div>
                                    
                                    {/* Station List Header */}
                                    <div className="flex justify-between items-center pt-1">
                                        <span className="text-white/50 text-xs font-medium uppercase tracking-wider">Stations</span>
                                        <div className="flex gap-0.5 bg-white/10 p-0.5 rounded-full">
                                            <button 
                                                onClick={() => setShowFavoritesOnly(false)}
                                                className={`text-[10px] px-3 py-1 rounded-full transition-all font-medium ${!showFavoritesOnly ? 'bg-white text-black' : 'text-white/50'}`}
                                            >
                                                All
                                            </button>
                                            <button 
                                                onClick={() => setShowFavoritesOnly(true)}
                                                className={`text-[10px] px-3 py-1 rounded-full transition-all ${showFavoritesOnly ? 'bg-white text-black' : 'text-white/50'}`}
                                            >
                                                ♥
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {/* Scrollable Station List */}
                                    <div className="overflow-y-auto max-h-[35vh] space-y-1 -mx-1 px-1">
                                        {filteredStations.length === 0 ? (
                                            <div className="text-center text-white/40 py-6 text-sm">
                                                No stations found
                                            </div>
                                        ) : (
                                            filteredStations.map(station => (
                                                <div 
                                                    key={station.id}
                                                    onClick={() => {
                                                        setCurrentStation(station);
                                                        setIsPlaying(true);
                                                        setSmartQuery(""); 
                                                        setError(false);
                                                    }}
                                                    className={`flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all active:scale-[0.98] ${currentStation.id === station.id ? 'bg-white/15' : 'bg-white/5'}`}
                                                >
                                                    <div className="flex items-center gap-3 overflow-hidden">
                                                        <div 
                                                            className="w-1 h-8 rounded-full flex-shrink-0 opacity-80" 
                                                            style={{ backgroundColor: station.color }}
                                                        ></div>
                                                        <div className="overflow-hidden">
                                                            <h4 className={`text-sm font-medium truncate ${currentStation.id === station.id ? 'text-white' : 'text-white/80'}`}>
                                                                {station.name}
                                                            </h4>
                                                            <p className="text-[11px] text-white/40 truncate">{station.genre}</p>
                                                        </div>
                                                    </div>
                                                    {currentStation.id === station.id && isPlaying && !error && (
                                                        <div className="flex gap-0.5 items-end h-3 mr-1">
                                                            <div className="w-0.5 bg-white/70 animate-[pulse_0.6s_ease-in-out_infinite] h-full rounded-full"></div>
                                                            <div className="w-0.5 bg-white/70 animate-[pulse_0.8s_ease-in-out_infinite] h-2/3 rounded-full"></div>
                                                            <div className="w-0.5 bg-white/70 animate-[pulse_0.5s_ease-in-out_infinite] h-full rounded-full"></div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className={`hidden md:block pointer-events-none text-center p-2 ui-content ${isUIHidden ? 'ui-hidden' : ''}`}>
                            <p className="text-[10px] text-white/30 font-light">
                                Tap display to change visualizer • Drag to rotate
                            </p>
                        </div>
                    </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
